# ──────────────────────────────────────────────────────
#  nginx/nginx.conf
#  Reverse proxy / Load balancer para TapoMon.
#
#  Enrutamiento:
#    /coordinator/*  →  Coordinador Central (puerto 8080)
#    /*              →  Servidor regional según header X-Server-Region
#
#  El cliente envía X-Server-Region: <nombre> en cada request
#  y Nginx lo enruta al servidor correspondiente.
#  Si no hay header, retorna 400.
#
#  Los endpoints /internal/* NO se exponen al exterior.
# ──────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Logging ──────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_x_server_region" -> $upstream_addr';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Timeouts ─────────────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # ── Upstreams (servidores regionales) ─────────────────
    upstream server_norte {
        server tapomon-server-norte:8000;
    }

    upstream server_sur {
        server tapomon-server-sur:8000;
    }

    upstream server_centro {
        server tapomon-server-centro:8000;
    }

    upstream coordinator {
        server tapomon-coordinator:8080;
    }

    # ── Map: header X-Server-Region o arg region → upstream ───────────
    map $http_x_server_region $actual_region {
        default $http_x_server_region;
        ""      $arg_region;
    }

    map $actual_region $target_upstream {
        default         "";
        "norte"         "server_norte";
        "sur"           "server_sur";
        "centro"        "server_centro";
    }

    server {
        listen 80;
        server_name _;

        # ── Coordinador: rutas /coordinator/* ────────────
        # Siempre accesible sin header, para asignar/resolver/migrar.
        location /coordinator/ {
            # Reescribir la URL para quitar el prefijo /coordinator
            rewrite ^/coordinator/(.*)$ /$1 break;
            proxy_pass http://coordinator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Bloquear acceso público a endpoints internos ─
        location /internal/ {
            return 403 '{"detail": "Endpoints internos no accesibles desde el exterior."}';
            add_header Content-Type application/json always;
        }

        # ── Todas las demás rutas: enrutar por región ────
        location / {
            # Si no hay header X-Server-Region, retornar 400
            if ($target_upstream = "") {
                return 400 '{"detail": "Header X-Server-Region requerido. Usa /coordinator/resolve/{usuario_id} para obtener tu servidor."}';
            }

            # Proxy dinámico al upstream correcto
            proxy_pass http://$target_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Server-Region $actual_region;
        }
    }
}
