[pytest]
# pytest-asyncio: evita el PytestDeprecationWarning sobre loop scope
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Suprimir las DeprecationWarnings internas de pytest-asyncio 0.24.0
# (usa asyncio.iscoroutinefunction y asyncio.get_event_loop_policy que están
# deprecadas en Python 3.14 y se eliminarán en 3.16).
# Estos warnings son del paquete, no de nuestro código.
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*
    ignore::DeprecationWarning:anyio.*
