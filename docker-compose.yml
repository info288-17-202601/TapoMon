# ──────────────────────────────────────────────────────
#  docker-compose.yml  —  TapoMon SERVER STACK
#
#  Manages the central server and its MongoDB.
#  Run once per deployment:
#
#    docker compose up -d
#    docker compose down
# ──────────────────────────────────────────────────────

services:

  # ── Central MongoDB (server-side Pet State Store) ──────────────────
  mongodb:
    image: mongo:7
    container_name: tapomon-mongo
    restart: unless-stopped
    volumes:
      - mongo_server_data:/data/db
    networks:
      - tapomon-server-net
    # NOT exposed to host — clients talk to the server via HTTP, not directly
    environment:
      MONGO_INITDB_DATABASE: Tapomon
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Central Server (FastAPI + APScheduler) ─────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tapomon-server
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8000:8000"          # Clients (and players) reach the server here
    networks:
      - tapomon-server-net
    env_file:
      - ./server/.env

networks:
  tapomon-server-net:
    driver: bridge

volumes:
  mongo_server_data:
    name: tapomon-server-mongo
